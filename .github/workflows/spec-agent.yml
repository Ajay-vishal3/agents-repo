name: Spec Agent (reusable)

on:
  workflow_call:
    inputs:
      issue-number:
        description: Issue number in the stories repo
        required: true
        type: string
      issue-title:
        description: Issue title; must start with the story id, e.g. "DEMO-1: ..."
        required: true
        type: string
      agents-repo:
        description: This repo as owner/name, so the job can check out the prompt and script
        required: true
        type: string
      agents-ref:
        description: Branch or tag of the agents repo to use
        required: false
        type: string
        default: main
      model:
        description: GitHub Models id (list them at https://models.github.ai/catalog/models)
        required: false
        type: string
        default: openai/gpt-4o-mini

jobs:
  spec-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      models: read
    concurrency:
      group: spec-agent-${{ inputs.issue-number }}
      cancel-in-progress: false

    steps:
      - name: Work out story id and branch from the issue title
        id: story
        env:
          TITLE: ${{ inputs.issue-title }}
        run: |
          STORY_ID=$(echo "$TITLE" | grep -oE '^[A-Za-z]+-[0-9]+' || true)
          if [ -z "$STORY_ID" ]; then
            echo "Issue title must start with a story id such as DEMO-1" >&2
            exit 1
          fi
          echo "story_id=$STORY_ID" >> "$GITHUB_OUTPUT"
          echo "branch=story/$STORY_ID" >> "$GITHUB_OUTPUT"

      # In a reusable workflow, the default checkout is the CALLER repo (the stories repo).
      - name: Check out the story branch (stories repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.story.outputs.branch }}
          path: story

      - name: Check out the agent prompt and script (agents repo)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agents-repo }}
          ref: ${{ inputs.agents-ref }}
          path: agents
          persist-credentials: false

      - name: Run the spec agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORY_ID: ${{ steps.story.outputs.story_id }}
          MODEL: ${{ inputs.model }}
        run: python3 agents/scripts/spec_agent.py

      - name: Commit specification.md to the story branch
        working-directory: story
        env:
          STORY_ID: ${{ steps.story.outputs.story_id }}
          BRANCH: ${{ steps.story.outputs.branch }}
        run: |
          git config user.name "spec-agent[bot]"
          git config user.email "spec-agent@users.noreply.github.com"
          git add "stories/${STORY_ID}/specification.md"
          git commit -m "spec-agent: draft specification for ${STORY_ID}" || echo "Nothing new to commit"
          git push origin "HEAD:${BRANCH}"

      - name: Open a pull request for review
        id: pr
        working-directory: story
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STORY_ID: ${{ steps.story.outputs.story_id }}
          BRANCH: ${{ steps.story.outputs.branch }}
          ISSUE: ${{ inputs.issue-number }}
        run: |
          PR_URL=$(gh pr list --head "$BRANCH" --base main --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --head "$BRANCH" --base main \
              --title "${STORY_ID}: specification (draft)" \
              --body "Draft specification generated by the spec agent for #${ISSUE}. Review the files, then merge to approve.")
          fi
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Move the issue to the next state and comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue-number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create "state:spec-drafted" --color 0E8A16 2>/dev/null || true
          gh issue edit "$ISSUE" \
            --remove-label "state:ready-for-spec" \
            --add-label "state:spec-drafted"
          gh issue comment "$ISSUE" --body "Spec agent finished. Draft: ${PR_URL}  (run: ${RUN_URL})"

      - name: Report failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue-number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "Spec agent failed. See the run log: ${RUN_URL}. Fix the problem, then remove and re-add the label state:ready-for-spec to retry." || true
